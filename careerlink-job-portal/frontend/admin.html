<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | CareerLink</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="admin-container">
      <!-- SIDEBAR -->
      <div class="admin-sidebar">
        <h2>Admin Panel</h2>
        <a href="#users">Manage Users</a>
        <a href="#jobs">Manage Jobs</a>
        <a href="index.html">Back to Site</a>
      </div>

      <!-- MAIN CONTENT -->
      <div class="admin-main">
        <!-- USERS -->
        <div class="admin-card" id="users">
          <h2 class="heading-secondary">Manage Users</h2>

          <!-- <button class="btn btn-add" onclick="addUser()">+ Add User</button> -->

          <table>
            <thead>
              <tr>
                <th>User ID</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="userTable"></tbody>
          </table>
        </div>

        <!-- JOBS -->
        <div class="admin-card" id="jobs">
          <h2 class="heading-secondary">Manage Job Listings</h2>
          <button class="btn btn-add" onclick="addJob()">+ Add Job</button>

          <table>
            <thead>
              <tr>
                <th>Job ID</th>
                <th>Title</th>
                <th>Company</th>
                <th>Action</th>
              </tr>
            </thead>

            <tbody id="jobTable">
              <button class="btn btn-danger" onclick="deleteJob(this)">
                Delete
              </button>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
